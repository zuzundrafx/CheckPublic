<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UFC Fantasy</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <!-- Загрузочный экран (можно кастомизировать) -->
        <div class="loading-progress">
            <div class="loading-spinner"></div>
            <div class="loading-message">Loading UFC Fantasy...</div>
        </div>
    </div>

    <!-- Подключение скриптов Telegram WebApp -->
    <script src="js/telegram-webapp.js"></script>
    <script src="js/telegram.js"></script>

    <!-- Обязательные скрипты Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- PWA (опционально) -->
    <script>navigator.serviceWorker.register('service-worker.js');</script>

    <style>
        /* Базовые стили загрузки */
        .loading-progress {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e62429; /* UFC красный */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-message {
            margin-top: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
        }
    </style>
</body>

</html>
